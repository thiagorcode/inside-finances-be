name: CI

on:
  push:
    branches: [ "prod", "develop" ]
  pull_request:
    branches: [ "prod" ]

  workflow_dispatch:

jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner used to run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks to be executed as part of the job
    steps:
      - uses: actions/checkout@v4

      - name: Setup NodeJs
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Dependencies
        working-directory: ./server
        run: yarn

      - name: Build
        working-directory: ./server
        run: yarn build

      - name: rsync deployments
        # Deploy automático apenas em push para prod; nos demais gatilhos roda apenas o CI (build)
        if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
        uses: burnett01/rsync-deployments@5.1
        with:
          switches: -avzr --delete
          path: ./*
          remote_path: /live
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: "${{ secrets.SSH_KEY }}"
