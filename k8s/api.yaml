apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: finances-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3333
          env:
            - name: ENVIRONMENT
              value: "local"
            - name: JWT_KEY
              value: "jwt-secret-key"
            - name: ENABLE_ORM_LOGS
              value: "true"
            - name: PORT
              value: "3333"
            - name: DB_HOST
              value: db-service
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_DATABASE
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector:
    app: api
  ports:
    - port: 3333
      targetPort: 3333
  type: ClusterIP
